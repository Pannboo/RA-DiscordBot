services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ra
      POSTGRES_PASSWORD: ra
      POSTGRES_DB: ra_bot
    restart: unless-stopped
    # Give Postgres time to checkpoint and shut down cleanly. Docker's default
    # 10s often isn't enough, and a SIGKILL forces crash recovery on next boot.
    stop_grace_period: 60s
    # Published on host port 6969 (not 5432) so it can't clash with another
    # Postgres on the host. Only needed for connecting from the host, e.g. with
    # a database tool; the bot uses the internal network on port 5432.
    ports:
      - "6969:5432"
    volumes:
      - ra_pg_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 checks over TCP, so the check can't pass against the
      # socket-only temporary server Postgres runs during first-time init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ra -d ra_bot"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Failures during this window don't count toward retries, so crash
      # recovery / WAL replay after an unclean stop doesn't mark it unhealthy.
      start_period: 120s

  bot:
    image: pannboo/ra-discord-bot:latest
    build: .
    # Only wait for Postgres to *start*. The bot finds the database and waits
    # for it to be ready itself, so a slow start never fails the deploy.
    depends_on:
      db:
        condition: service_started
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DEV_GUILD_IDS: ${DEV_GUILD_IDS:-}
      RA_API_USERNAME: ${RA_API_USERNAME}
      RA_API_KEY: ${RA_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # No DATABASE_URL needed: the bot finds Postgres on its own network using
      # these credentials, whatever the service or container is named. Set
      # DATABASE_URL (or DB_HOST) to point it somewhere specific.
      DB_USER: ra
      DB_PASSWORD: ra
      DB_NAME: ra_bot
    restart: unless-stopped

volumes:
  ra_pg_data:
